name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a clean deployment directory to avoid history/large file issues
          mkdir deploy_tmp
          cp -r scripts deploy_tmp/
          cp Dockerfile .dockerignore package.json package-lock.json deploy_tmp/
          [ -f cookies.txt ] && cp cookies.txt deploy_tmp/ || echo "No cookies.txt to copy"
          cp README.hf.md deploy_tmp/README.md
          cd deploy_tmp
          
          # Initialize fresh git with no history
          git init -b main
          git config user.email "bot@example.com"
          git config user.name "HF Sync Bot"
          git add .
          git commit -m "deploy: sync-runner (clean build)"
          
          # Retry logic for transient server errors
          for i in {1..3}; do
            git push --force https://dejiaug:$HF_TOKEN@huggingface.co/spaces/dejiaug/video-sync-runner-prod main && break || \
            (echo "Push failed, retrying in 30s..." && sleep 30)
          done
