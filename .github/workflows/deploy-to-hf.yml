name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "HF Sync Bot"
          rm -rf public
          git add .
          git commit -m "chore: remove frontend files for sync-runner" || echo "No changes to commit"
          # Retry logic for transient server errors (like 504)
          for i in {1..3}; do
            git push --force https://dejiaug:$HF_TOKEN@huggingface.co/spaces/dejiaug/video-sync-runner main && break || \
            (echo "Push failed, retrying in 30s..." && sleep 30)
          done
