<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SOOZ - Sound Out Of Zion</title>
  <meta name="description"
    content="SOOZ - A faith-based social media platform. Share your journey, connect with believers worldwide. Psalms 110:3" />
  <meta name="author" content="SOOZ" />
  <meta name="theme-color" content="#05070b" />
  <meta name="color-scheme" content="dark light" />
  <script>
    // Apply the saved appearance before anything paints (dark is the default).
    (function () {
      try {
        var dark = localStorage.getItem("sooz-mode") !== "light";
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        if (!dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#faf8f4");
      } catch (e) {}
    })();
  </script>

  <meta property="og:title" content="SOOZ - Sound Out Of Zion" />
  <meta property="og:description"
    content="A faith-based social media platform. Share your journey, connect with believers worldwide." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://sooz.vercel.app/sooz-logo-v3.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@SOOZ" />
  <meta name="twitter:image" content="https://sooz.vercel.app/sooz-logo-v3.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="https://sooz.vercel.app/sooz-logo-v3.png" />
  <link rel="icon" type="image/png" href="https://sooz.vercel.app/sooz-logo-v3.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open connections early so the feed, media and fonts start downloading sooner -->
  <link rel="preconnect" href="https://xhqpojnmcibkaydidnex.supabase.co" crossorigin />
  <link rel="preconnect" href="https://pub-e59dafe72724404d8ae7af425d1dfbdc.r2.dev" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://www.tiktok.com" />

  <!-- Fonts load without blocking the first paint -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" />

  <style>
    html, body { background: #05070b; margin: 0; }
    html:not(.dark), html:not(.dark) body { background: #faf8f4; }
    .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(90% 60% at 50% 35%, rgba(245, 158, 11, 0.16), transparent 70%), #05070b; }
    html:not(.dark) .boot { background: radial-gradient(90% 60% at 50% 35%, rgba(245, 158, 11, 0.14), transparent 70%), #faf8f4; }
    .boot i { width: 132px; aspect-ratio: 640 / 440; background: linear-gradient(170deg, #fde68a, #fbbf24 40%, #d97706);
      -webkit-mask: url(/brand/sooz-logo-mask.png) center / contain no-repeat; mask: url(/brand/sooz-logo-mask.png) center / contain no-repeat;
      animation: boot-pulse 1.6s ease-in-out infinite; }
    html:not(.dark) .boot i { background: linear-gradient(170deg, #d97706, #b45309 55%, #92400e); }
    @keyframes boot-pulse { 0%, 100% { opacity: 0.6; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
  </style>
</head>

<body>
  <div id="root"><div class="boot" role="img" aria-label="Loading SOOZ"><i></i></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
